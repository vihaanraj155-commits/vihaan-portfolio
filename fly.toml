# Fly.io deployment. `fly deploy` builds the root Dockerfile and runs a single machine serving
# both the site and the API on port 8000.

app = "vihaan-portfolio"
primary_region = "ewr"  # Newark -- closest region to New Jersey.

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  # Single origin: the site and the API are the same host, so the browser never makes a
  # cross-origin request and the allow-list stays empty.
  CORS_ORIGINS = ""
  FRONTEND_DIST = "/app/frontend_dist"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  # 1 rather than 0: a cold start would make the first visitor wait a few seconds. Drop to 0
  # to trade that for near-zero cost while idle.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Contact submissions are appended to /app/data/messages.jsonl. Fly machine filesystems are
# ephemeral, so without this volume every deploy would wipe them.
#
# A volume attaches to one machine, and services/rate_limit.py keeps its window in process
# memory -- both reasons not to `fly scale count` past 1.
[mounts]
  source = "portfolio_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
