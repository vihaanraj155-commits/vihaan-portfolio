name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight checks for the same ref. Deployment is handled by Cloudflare
  # Pages from its own git integration, so nothing here needs to survive cancellation.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12 to match the runtime image rather than the 3.14 local venv.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Install the pinned runtime set, not the floating pyproject one, so CI exercises the
      # same versions the image ships.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint
        run: ruff check .

      # tests/ has an __init__.py, so pytest puts backend/ on sys.path and `app` imports
      # without the package needing to be installed.
      - name: Test
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci rather than npm install: it fails loudly on lockfile drift, which is exactly
      # what the Docker build would hit later.
      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the type-check gate too.
      - run: npm run build
