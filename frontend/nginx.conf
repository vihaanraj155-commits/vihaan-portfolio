server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real visitor IP has to survive the hop, or the contact rate limiter buckets everyone
    # behind this proxy into a single counter.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Hashed asset filenames make these safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: /projects/:slug must serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves visitors on stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
