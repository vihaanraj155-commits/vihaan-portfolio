    <meta
      name="description"

    <meta name="author" content="Vihaan Rajagopal" />
    <link rel="canonical" href="https://vihaan-portfolio.pages.dev/" />

    <meta property="og:type" content="website" />

      property="og:description"

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vihaan Rajagopal",
        "jobTitle": "Student Researcher & Developer",
        "url": "https://vihaan-portfolio.pages.dev/",
        "alumniOf": "Edison High School",
        "knowsAbout": [
          "Smart-space systems",
          "Cybersecurity",
          "Cloud computing",
          "Applied AI and LLMs",
          "Robotics"
        ]
      }
    </script>

    <!--
      Theme must be resolved before first paint, or a dark-mode visitor sees a white flash.
      This runs synchronously and deliberately blocks rendering for the microsecond it takes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
